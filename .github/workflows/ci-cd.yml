name: Amul Party Platform — CI/CD & Quality Gates

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    name: Security Scan, Typecheck & E2E Verification Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Automated E2E Verification, RBAC, Atomic Rollback & Security Test Suite
        run: node backend/tests/run_verification_suite.mjs
