version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: amul-party-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only_change_me}
      MYSQL_DATABASE: amul_distribution
      MYSQL_USER: amul_app_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-app_dev_only_change_me}
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=REPEATABLE-READ
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amul-party-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: amul-party-admin-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  mysql_data:
